<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Posts - Sketchy Dedications</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">🎵 Sketchy Dedications</a>
      <ul class="navbar-nav">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="feed.html" class="nav-link">Feed</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li id="navAuth"></li>
      </ul>
    </div>
  </nav>

  <main class="main-content">
    <div class="container" style="max-width: 700px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="margin: 0;">🔖 Saved Posts</h2>
        <a href="feed.html" class="btn btn-outline btn-sm">← Back to Feed</a>
      </div>

      <div id="savedPostsContainer"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Sketchy Dedications</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!SD.Auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }

      loadSavedPosts();
    });

    function loadSavedPosts() {
      const saved = SD.Posts.getAll().filter(p => SD.Posts.isSaved(p.id));
      SD.Posts.render('savedPostsContainer', saved);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Picture - Sketchy Dedications</title>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Indie Flower', cursive;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  background:#fff;
  border:3px dashed #333;
  border-radius:20px;
  padding:40px;
  width:400px;
  text-align:center;
  box-shadow:8px 8px 0 #999;
}
h1{margin-bottom:25px;font-size:32px;}
.profile-pic{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#000;
  margin-bottom:20px;
  background-size:cover;
}
input[type=file]{margin-top:15px;}
button{
  padding:10px 20px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#333;
  color:white;
  cursor:pointer;
}
button:hover{background:#6e8efb;}
</style>
</head>
<body>
<div class="container">
  <h1>Profile Picture</h1>
  <div class="profile-pic" id="profilePicDiv"></div>
  <input type="file" id="picInput" accept="image/*">
  <button onclick="changePic()">Change Picture</button>
  <br><br>
  <button onclick="goBack()">Back to Profile</button>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem("currentUser"));
let picDiv = document.getElementById("profilePicDiv");
if(currentUser.profilePic){
  picDiv.style.backgroundImage = `url(${currentUser.profilePic})`;
}

function changePic(){
  let fileInput = document.getElementById("picInput");
  if(fileInput.files.length==0) return alert("Select a picture first!");
  let reader = new FileReader();
  reader.onload = function(e){
    currentUser.profilePic = e.target.result;
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
    let users = JSON.parse(localStorage.getItem("users"));
    users[currentUser.username] = currentUser;
    localStorage.setItem("users", JSON.stringify(users));
    picDiv.style.backgroundImage = `url(${currentUser.profilePic})`;
    alert("Profile picture updated!");
  }
  reader.readAsDataURL(fileInput.files[0]);
}

function goBack(){
  window.location.href = "profile.html";
}
</script>
</body>
</html>

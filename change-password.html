<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password - Sketchy Dedications</title>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Indie Flower', cursive;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  background:#fff;
  border:3px dashed #333;
  border-radius:20px;
  padding:40px;
  width:400px;
  text-align:center;
  box-shadow:8px 8px 0 #999;
}
h1{margin-bottom:25px;font-size:32px;}
input{
  width:90%;
  padding:12px;
  margin:10px 0;
  border:2px solid #333;
  border-radius:12px;
  font-family:'Indie Flower', cursive;
  font-size:16px;
}
button{
  padding:10px 20px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#333;
  color:white;
  cursor:pointer;
}
button:hover{background:#6e8efb;}
</style>
</head>
<body>
<div class="container">
  <h1>Change Password</h1>
  <input type="password" id="oldPass" placeholder="Current Password" required><br>
  <input type="password" id="newPass" placeholder="New Password" required><br>
  <input type="password" id="confirmPass" placeholder="Confirm New Password" required><br>
  <button onclick="changePassword()">Save New Password</button>
  <br><br>
  <button onclick="goBack()">Back to Profile</button>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser){
  alert("Please log in first");
  window.location.href = "login.html";
}

function changePassword(){
  let oldPass = document.getElementById("oldPass").value.trim();
  let newPass = document.getElementById("newPass").value.trim();
  let confirmPass = document.getElementById("confirmPass").value.trim();

  if(oldPass !== currentUser.password){
    return alert("❌ Current password is incorrect!");
  }

  let lastChange = currentUser.lastPasswordChange ? new Date(currentUser.lastPasswordChange) : new Date(0);
  let now = new Date();
  let diffDays = Math.floor((now - lastChange)/(1000*60*60*24));
  if(diffDays < 7){
    return alert(`❌ You can change your password only once every 7 days. Wait ${7-diffDays} more day(s).`);
  }

  if(newPass !== confirmPass){
    return alert("❌ New passwords do not match!");
  }

  // Update password
  currentUser.password = newPass;
  currentUser.lastPasswordChange = now.toISOString();

  // Update users object
  let users = JSON.parse(localStorage.getItem("users"));
  users[currentUser.username] = currentUser;
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  alert("✅ Password changed successfully!");
  window.location.href = "profile.html";
}

function goBack(){
  window.location.href = "profile.html";
}
</script>
</body>
</html>

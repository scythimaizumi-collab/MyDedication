<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchy Dedications - Login/Signup</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🎵 Sketchy Dedications</h1>
  </header>

  <main class="auth-container">
    <div class="auth-box">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="Username" required>
        <input type="password" id="loginPass" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>

    <div class="auth-box">
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" id="signupUser" placeholder="Choose Username" required>
        <input type="password" id="signupPass" placeholder="Choose Password" required>
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Made with ❤️ in the Philippines</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>

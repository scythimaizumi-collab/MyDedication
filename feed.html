<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchy Dedications - Feed</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🎵 Sketchy Dedications</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <section class="create-post">
      <h2>Create a Post</h2>
      <form id="postForm">
        <input type="text" id="desc" placeholder="Write a message..." required>
        <input type="url" id="song" placeholder="Paste song link (YouTube/Spotify)" required>
        <input type="file" id="image" accept="image/*" required>
        <button type="submit">Post ✨</button>
      </form>
    </section>

    <section class="feed" id="feed">
      <h2>Feed</h2>
      <div id="posts"></div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ in the Philippines</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
